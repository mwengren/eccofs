[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eccofs"
version = "0.1.0"
description = "Python tools for working with ECCOFS (NOAA East Coast Coastal Ocean Forecast System) data."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Micah Wengren" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "icechunk>=1.0",
    "xarray>=2025.1",
    "zarr>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/mwengren/eccofs"
Issues = "https://github.com/mwengren/eccofs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eccofs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
